<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đặt Hàng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Đặt Hàng Trực Tuyến</h1>
        <form id="orderForm">
            <div class="form-group">
                <label for="product">Tên sản phẩm:</label>
                <select id="product" name="product">
                    <option value="">-- Chọn sản phẩm --</option>
                    <option value="Áo">Áo</option>
                    <option value="Quần">Quần</option>
                    <option value="Giày">Giày</option>
                    <option value="Mũ">Mũ</option>
                </select>
                <span class="error" id="productError"></span>
            </div>

            <div class="form-group">
                <label for="quantity">Số lượng:</label>
                <input type="number" id="quantity" name="quantity" min="1" max="99" value="1">
                <span class="error" id="quantityError"></span>
            </div>

            <div class="form-group">
                <label for="deliveryDate">Ngày giao hàng:</label>
                <input type="date" id="deliveryDate" name="deliveryDate">
                <span class="error" id="deliveryDateError"></span>
            </div>

            <div class="form-group">
                <label for="address">Địa chỉ giao:</label>
                <textarea id="address" name="address" rows="3"></textarea>
                <span class="error" id="addressError"></span>
            </div>

            <div class="form-group">
                <label for="note">Ghi chú:</label>
                <textarea id="note" name="note" rows="3" maxlength="200"></textarea>
                <div class="char-count">
                    <span id="charCount">0/200</span>
                </div>
                <span class="error" id="noteError"></span>
            </div>

            <div class="form-group">
                <label>Phương thức thanh toán:</label>
                <div class="radio-group">
                    <input type="radio" id="cod" name="payment" value="COD">
                    <label for="cod">COD</label>
                    <input type="radio" id="bank" name="payment" value="Chuyển khoản">
                    <label for="bank">Chuyển khoản</label>
                    <input type="radio" id="wallet" name="payment" value="Ví điện tử">
                    <label for="wallet">Ví điện tử</label>
                </div>
                <span class="error" id="paymentError"></span>
            </div>

            <div class="form-group">
                <label>Tổng tiền:</label>
                <span id="totalPrice">0 VND</span>
            </div>

            <button type="submit">Đặt hàng</button>
        </form>

        <div id="confirmation" class="confirmation hidden">
            <h2>Xác nhận đơn hàng</h2>
            <p><strong>Sản phẩm:</strong> <span id="confirmProduct"></span></p>
            <p><strong>Số lượng:</strong> <span id="confirmQuantity"></span></p>
            <p><strong>Tổng tiền:</strong> <span id="confirmTotal"></span></p>
            <p><strong>Ngày giao:</strong> <span id="confirmDate"></span></p>
            <button id="confirmBtn">Xác nhận</button>
            <button id="cancelBtn">Hủy</button>
        </div>

        <div id="successMessage" class="success hidden">
            Đặt hàng thành công!
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
